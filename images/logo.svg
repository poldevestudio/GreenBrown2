<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Organic Leaf + Earth Icon -->
  <g transform="translate(10, 12)">
    <!-- Soil / Earth Curve (Brown) -->
    <path d="M4 46 C 18 42, 38 42, 52 46 C 44 54, 12 54, 4 46 Z" fill="#8C6541"/>
    <!-- Blade 1 / Main Leaf (Dark Forest Green) -->
    <path d="M12 44 C 10 20, 24 6, 38 2 C 34 16, 30 36, 26 44 Z" fill="#1B3B2B"/>
    <!-- Blade 2 / Fresh Green Leaf (Emerald / Moss) -->
