    <path d="M22 40 C 24 24, 32 14, 37 8" stroke="#D3E2CD" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Brand Typography -->
  <text x="82" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#14281D">GREEN <tspan fill="#8C6541" font-weight="700">BROWN</tspan></text>
  <text x="84" y="60" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.22em" fill="#586A5F">ESPACIOS VERDES & INDUSTRIALES</text>
