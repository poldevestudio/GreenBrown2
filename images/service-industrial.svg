  <path d="M40 140 L40 90 L110 90 L130 115 L200 115 L220 85 L320 85 L320 140 Z" fill="#D2DCD6"/>
  <rect x="70" y="105" width="25" height="20" fill="#EEF2F0"/>
  <rect x="250" y="100" width="30" height="20" fill="#EEF2F0"/>
