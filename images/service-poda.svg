<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#F4F1EA"/>
  <!-- Trees with clean pruning silhouette -->
  <path d="M0 190 L400 190 L400 260 L0 260 Z" fill="#2E5037"/>
  <!-- Tree 1 -->
  <path d="M120 190 L120 110 Q 120 95 105 85" stroke="#67492E" stroke-width="12" stroke-linecap="round"/>
  <path d="M120 135 Q 145 115 155 100" stroke="#67492E" stroke-width="8" stroke-linecap="round"/>
  <circle cx="95" cy="70" r="38" fill="#3D6847"/>
  <circle cx="150" cy="85" r="32" fill="#52885E"/>
  <circle cx="120" cy="55" r="34" fill="#46734B"/>
  <!-- Pruning Shears / Chainsaw graphic -->
  <g transform="translate(230, 80)">
    <circle cx="60" cy="50" r="35" fill="#14281D" opacity="0.08"/>
    <!-- Pruning blade tool -->
    <path d="M15 85 L65 35" stroke="#8C6541" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 95 L75 45" stroke="#8C6541" stroke-width="8" stroke-linecap="round"/>
    <path d="M65 35 L105 15 L85 55 Z" fill="#4A5568"/>
    <path d="M75 45 L115 25 L95 65 Z" fill="#718096"/>
    <circle cx="70" cy="40" r="5" fill="#E2E8F0"/>
    <!-- Cut leaves falling -->
    <path d="M90 90 C 85 95, 80 110, 85 115 C 95 110, 100 95, 90 90 Z" fill="#52885E"/>
    <path d="M110 80 C 105 85, 102 98, 108 102 C 115 98, 118 85, 110 80 Z" fill="#6FB87E"/>
  </g>
</svg>
