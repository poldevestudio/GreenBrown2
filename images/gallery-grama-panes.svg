<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <!-- Rich Soil and freshly laid lush green turf slabs -->
  <rect width="500" height="340" rx="16" fill="#5A3E25"/>
  <rect x="0" y="0" width="500" height="180" fill="#315B3A"/>
  <!-- Laid brickwork pattern of turf panes -->
  <g stroke="#234229" stroke-width="2.5">
    <rect x="10" y="10" width="150" height="75" rx="3" fill="#3D7048"/>
    <rect x="170" y="10" width="150" height="75" rx="3" fill="#3A6A44"/>
    <rect x="330" y="10" width="160" height="75" rx="3" fill="#3D7048"/>
    <rect x="0" y="95" width="90" height="75" rx="3" fill="#3A6A44"/>
    <rect x="100" y="95" width="150" height="75" rx="3" fill="#3D7048"/>
    <rect x="260" y="95" width="150" height="75" rx="3" fill="#3A6A44"/>
    <rect x="420" y="95" width="80" height="75" rx="3" fill="#3D7048"/>
  </g>
  <!-- Slabs in progress of placement -->
  <rect x="40" y="190" width="140" height="70" rx="4" fill="#467C52" stroke="#234229" stroke-width="2"/>
  <rect x="200" y="195" width="130" height="65" rx="4" fill="#3D7048" stroke="#234229" stroke-width="2"/>
  <!-- Fine Soil texture flecks -->
  <circle cx="380" cy="240" r="3" fill="#785333"/>
  <circle cx="430" cy="270" r="4" fill="#785333"/>
  <circle cx="360" cy="285" r="3" fill="#785333"/>
  <!-- Tag -->
  <rect x="28" y="260" width="230" height="52" rx="10" fill="#FFFFFF" opacity="0.92"/>
  <text x="44" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#14281D">Colocación de Grama Bahiana</text>
  <text x="44" y="300" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#67492E">Nivelación y Panes Frescos</text>
</svg>
