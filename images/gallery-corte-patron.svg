<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none">
  <rect width="500" height="340" rx="16" fill="#1C3825"/>
  <!-- Alternating pristine lawn stripes -->
  <g opacity="0.9">
    <rect x="0" y="0" width="50" height="340" fill="#2A5034"/>
    <rect x="50" y="0" width="50" height="340" fill="#204029"/>
    <rect x="100" y="0" width="50" height="340" fill="#2A5034"/>
    <rect x="150" y="0" width="50" height="340" fill="#204029"/>
    <rect x="200" y="0" width="50" height="340" fill="#2A5034"/>
    <rect x="250" y="0" width="50" height="340" fill="#204029"/>
    <rect x="300" y="0" width="50" height="340" fill="#2A5034"/>
    <rect x="350" y="0" width="50" height="340" fill="#204029"/>
    <rect x="400" y="0" width="50" height="340" fill="#2A5034"/>
    <rect x="450" y="0" width="50" height="340" fill="#204029"/>
  </g>
  <!-- Curving stone pathway cutting through -->
  <path d="M0 260 C 180 240, 280 180, 420 80 L 470 90 C 320 200, 200 270, 0 300 Z" fill="#E8E2D8" opacity="0.9"/>
  <!-- Minimalist Clean Tag -->
  <rect x="28" y="260" width="230" height="52" rx="10" fill="#FFFFFF" opacity="0.92"/>
  <text x="44" y="284" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#14281D">Corte con Patrón Rayado</text>
  <text x="44" y="300" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#67492E">Parques de Country y Quintas</text>
</svg>
